input {
  jdbc {
    # MySQL连接配置
    jdbc_driver_library => "/usr/share/logstash/lib/mysql-connector-java-8.0.30.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://mysql:3306/test?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    jdbc_user => "root"
    jdbc_password => "root"

    # 每分钟执行一次
    schedule => "* * * * *"

    # 使用列值进行增量跟踪
    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/log/.last_run_gift_reward"

    # 查询语句
    statement => "SELECT * FROM gift_reward WHERE updated_at > :sql_last_value AND updated_at < NOW() ORDER BY updated_at ASC"

    # 添加站点ID元数据字段
    add_field => {
      "[@metadata][site_id]" => "%{site_id}"
    }
  }
}

filter {
  # 首先解析 created_at 字段
  date {
    match => ["created_at", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
    target => "created_at"
    timezone => "Asia/Shanghai"
    tag_on_failure => ["date_parse_failure"]
  }

  date {
    match => ["updated_at", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
    target => "updated_at"
    timezone => "Asia/Shanghai"
    tag_on_failure => ["date_parse_failure"]
  }

  # 根据 created_at 字段提取年月信息
  ruby {
    code => "
      require 'time'
      if event.get('created_at')
        # 从 created_at 字段提取年月
        created_time = event.get('created_at')
        # 转换为东八区时间并格式化
        local_time = created_time + 8 * 3600
        index_date = local_time.strftime('%Y_%m')
        event.set('[@metadata][index_date]', index_date)
      else
        # 如果 created_at 为空，使用当前时间作为后备
        event.set('[@metadata][index_date]', Time.now.getlocal('+08:00').strftime('%Y_%m'))
      end
    "
  }

  # 将时间字段转换为ISO8601格式（带时区）
  ruby {
    code => "
      require 'time'
      ['created_at', 'updated_at'].each do |field|
        if event.get(field)
          utc_time = event.get(field).time
          local_time = utc_time + 8 * 3600  # 转换为 Asia/Shanghai
          formatted_date = local_time.strftime('%Y-%m-%dT%H:%M:%S') + '+08:00'
          event.set(field, formatted_date)
        end
      end
    "
  }

  # 构造索引名称：gift_reward_站点id_年_月（基于created_at）
  mutate {
    add_field => {
      "[@metadata][index_name]" => "gift_reward_%{[@metadata][site_id]}_%{[@metadata][index_date]}"
    }
    remove_field => ["@version"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_name]}"
    document_id => "%{id}"
    action => "update"
    doc_as_upsert => true
    timeout => 30
    user => "harris"
    password => "1234qwer666"
    retry_on_conflict => 2
    ecs_compatibility => "disabled"
  }

  # 可选：输出到控制台用于调试
  stdout {
    codec => rubydebug {
      metadata => true
    }
  }
}
