input {
  jdbc {
    # MySQL连接配置
    jdbc_driver_library => "/usr/share/logstash/lib/mysql-connector-java-8.0.30.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    # 显式声明数据库时区为东八区
    jdbc_connection_string => "jdbc:mysql://mysql:3306/test?useSSL=false&serverTimezone=Asia/Shanghai"
    jdbc_user => "root"
    jdbc_password => "root"

    # Schedule to run every minute
    schedule => "* * * * *"

    # Use column value for incremental tracking
    use_column_value => true
    tracking_column => "updated_at"  # Use timestamp directly instead of UNIX_TIMESTAMP
    tracking_column_type => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/log/.last_run_purchase"

    # Simplified query to avoid UNIX_TIMESTAMP conversion
    statement => "SELECT * FROM purchase_record WHERE updated_at > :sql_last_value AND updated_at < NOW() ORDER BY updated_at ASC"

    # Add metadata fields with default value for site_id to avoid null issues
    add_field => {
      "[@metadata][site_id]" => "%{site_id}"
    }
  }
}

filter {
  # 设置索引日期格式为 YYYY-MM（如 2025-07）
  ruby {
    code => "
      require 'time'
      event.set('[@metadata][current_date]', Time.now.getlocal('+08:00').strftime('%Y_%m'))
    "
  }
  date {
    match => ["subscription_at", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
    target => "subscription_at"
    timezone => "Asia/Shanghai"  # Parse as Asia/Shanghai
    tag_on_failure => ["date_parse_failure"]
  }
  date {
    match => ["created_at", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
    target => "created_at"
    timezone => "Asia/Shanghai"
    tag_on_failure => ["date_parse_failure"]
  }
  date {
    match => ["updated_at", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
    target => "updated_at"
    timezone => "Asia/Shanghai"
    tag_on_failure => ["date_parse_failure"]
  }

  date {
    match => ["match_time", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
    target => "match_time"
    timezone => "Asia/Shanghai"
    tag_on_failure => ["date_parse_failure"]
  }

  # 将时间字段转换为ISO8601格式（带时区）
  ruby {
    code => "
      require 'time'
      ['subscription_at', 'created_at', 'updated_at', 'match_time'].each do |field|
        if event.get(field)
          utc_time = event.get(field).time
          local_time = utc_time + 8*3600  # 转换为 Asia/Shanghai
          formatted_date = local_time.strftime('%Y-%m-%dT%H:%M:%S') + '+08:00'
          event.set(field, formatted_date)
        end
      end
    "
  }

  # 处理JSON字段
  if [order_detail] {
    json {
      source => "order_detail"
      target => "[@metadata][order_detail]"
      remove_field => ["order_detail"]
    }
  }

  # 构造索引名称
  mutate {
    add_field => {
      "[@metadata][index_name]" => "purchase_record_%{[@metadata][current_date]}"
    }
    remove_field => ["@version"]
  }
}

output {
  elasticsearch {
    # Elasticsearch连接配置
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_name]}"
    document_id => "%{id}"
    action => "update"
    doc_as_upsert => true
    timeout => 30
    user => "harris"
    password => "1234qwer666"
    # 添加重试机制
    retry_on_conflict => 2
    ecs_compatibility => "disabled"
  }

  # 可选：输出到控制台用于调试
  stdout {
    codec => rubydebug {
      metadata => true  # 显示元数据，便于调试
    }
  }
}
