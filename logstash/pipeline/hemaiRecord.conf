input {
  jdbc {
    # MySQL连接配置
    jdbc_driver_library => "/usr/share/logstash/lib/mysql-connector-java-8.0.30.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://mysql:3306/test?useSSL=false&serverTimezone=UTC"
    jdbc_user => "root"
    jdbc_password => "root"

    # 优化查询配置
    schedule => "* * * * *"  # 每分钟执行一次
    use_column_value => true
    tracking_column => "unix_ts_in_secs"
    tracking_column_type => "numeric"
    last_run_metadata_path => "/usr/share/logstash/log/logstash_jdbc_last_run"

    # 优化后的查询语句（使用索引）
    statement => "SELECT *, UNIX_TIMESTAMP(updated_at) AS unix_ts_in_secs FROM purchase_records WHERE updated_at > FROM_UNIXTIME(:sql_last_value) AND updated_at < NOW() ORDER BY updated_at ASC"

    # 添加站点ID和日期信息
    add_field => {
      "[@metadata][site_id]" => "%{site_id}"
      "[@metadata][current_date]" => "%{+YYYY_MM}"
    }
  }
}

filter {
  # 转换时间格式
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # 添加索引名称信息
  mutate {
    add_field => {
      "[@metadata][index_name]" => "purchase_record_%{[@metadata][site_id]}_%{[@metadata][current_date]}"
    }
  }
}

output {
  elasticsearch {
    # Elasticsearch连接配置
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_name]}"
    document_id => "%{id}"
    action => "update"
    doc_as_upsert => true

    # 如果Elasticsearch启用了安全认证
   user => "harris"
   password => "1234qwer666"
    # 添加重试机制
    retry_on_conflict => 2
    # ssl => true
    # cacert => "/path/to/http_ca.crt"
  }

  # 可选：输出到控制台用于调试
  stdout {
    codec => rubydebug {
      metadata => true  # 显示元数据，便于调试
    }
  }
}
