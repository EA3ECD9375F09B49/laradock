##
##
## 用户的 IP 地址 $binary_remote_addr 作为 Key，每个 IP 地址每秒处理 5 个请求
## 你想用程序每秒几百次的刷我，没戏，再快了就不处理了，直接返回 503 错误给你
## limit_req zone=req_limit_per_ip burst=9 nodelay; 最多 15 个排队， 由于每秒处理 5 个请求 + 15个排队，你一秒最多发送 20 个请求过来，再多就直接返回 503 错误给你了
limit_req_zone $binary_remote_addr zone=huipu_req_limit_per_ip:10m rate=5r/s;
#log_format postdata $request_body;
#    https://docs.nginx.com/nginx/admin-guide/monitoring/logging/
#    $upstream_connect_time – The time spent on establishing a connection with an upstream server
#    $upstream_header_time – The time between establishing a connection and receiving the first byte of the response header from the upstream server
#    $upstream_response_time – The time between establishing a connection and receiving the last byte of the response body from the upstream server
#    $request_time – The total time spent processing a request

# Define custom log format for detailed request and response tracking
log_format huipulogformat '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time" '
                      'req_body=$request_body ssl_protocol=$ssl_protocol ssl_cipher=$ssl_cipher';

server {

    listen 80;
    listen [::]:80;

    server_name api.huipu.me eadmin.huipu.me admin.huipu.me;
    root /var/www/minsheng/public;
 	
    #more_set_headers 'Server: Huaxing';
    ##
    # Nginx Bad Bot Blocker Includes
    # REPO: https://github.com/mitchellkrogza/nginx-ultimate-bad-bot-blocker
    ##
	include /etc/nginx/bots.d/ddos.conf; 
 	include /etc/nginx/bots.d/blockbots.conf;

    index index.php index.html index.htm;

    #location ~ ^/admin/ {
            # 保持原有的限流设置
    #        limit_req zone=huipu_req_limit_per_ip burst=15 nodelay;

            # 重写规则：将 admin/xxx 重写为 index.php?s=/xxx
    #        rewrite ^/admin/(.*)$ /index.php?s=/$1 last;

            # 如果没有匹配到重写规则，尝试直接访问文件
     #       try_files $uri $uri/ /index.php?s=/$uri&$args;
    #    }

    location / {
        limit_req zone=huipu_req_limit_per_ip burst=15 nodelay;
        try_files $uri $uri/ /index.php?s=$uri&$args;
    }

    location ~ \.php$ {
        include fastcgi_params;  # Include the fastcgi settings
        fastcgi_pass php-fpm74:9000;  # Change this if your PHP-FPM socket/port is different
        fastcgi_index index.php;  # Default index file
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;  # Path to the PHP file
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;  # Pass authorization headers
        fastcgi_buffers 16 16k;  # Adjust buffer settings
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 600;  # Fixes timeouts
    }

    # Security: Deny access to hidden files or directories (e.g., .git, .env)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }
    ########################## Check Request Methods and Some Bots ##############################################################
    ## Only allow these request methods ##
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|OPTIONS)$ ) {
        return 503;
       #return 444;
    }
      ## Do not accept DELETE, SEARCH and other methods ##########################
      ## Block download agents
      #PostmanRuntime/7.22.0
      #Apache-HttpClient/4.5.10 (Java/11.0.5)
      #RestSharp 106.6.10.0"
      ##
    if ($http_user_agent ~* LWP::Simple|BBBike|wget|PostmanRuntime|Apache-HttpClient|RestSharp) {
          return 503;
          #return 403;
    }
     ## Block some robots ##
    if ($http_user_agent ~* msnbot|scrapbot|Catall|Spider|AcoiRobot) {
          return 503;
          #return 403;
    }
     ## Deny certain Referers ###
    if ( $http_referer ~* (babes|forsale|girl|jewelry|love|nudit|organic|poker|porn|sex|teen) )
    {
        return 503;
        #return 403;
    }
  ##############################################################################################################################
    error_log /var/log/nginx/huipu_error.log;
    access_log /var/log/nginx/huipu_access.log huipulogformat;

    error_page 503 /503.html;
                location = /503.html {
                  root /usr/share/nginx/html;
                  internal;
                }
}
